<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Souper — Scouts Écaussinnes</title>
  <link rel="stylesheet" href="../style.css">
  <style>
    /* ── Layout souper ────────────────────────────────── */
    body { overflow: hidden; }

    #app-souper {
      display: flex;
      height: 100dvh;
    }

    /* ── Barre stats ──────────────────────────────────── */
    .stats-bar { gap: 16px; }

    .stats-bar .sep {
      width: 1px;
      height: 28px;
      background: var(--border);
      flex-shrink: 0;
    }

    .btn-standalone {
      padding: 9px 16px;
      border-radius: 12px;
      border: 1.5px solid var(--orange);
      background: #fff7f4;
      color: var(--orange);
      font-size: 13px;
      font-weight: 700;
      cursor: pointer;
      white-space: nowrap;
      transition: background 0.12s;
    }
    .btn-standalone:hover { background: #ffe8de; }

    .btn-nav {
      padding: 9px 16px;
      border-radius: 12px;
      border: 1.5px solid var(--border);
      background: var(--surface);
      color: var(--text-secondary);
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      text-decoration: none;
      display: inline-flex;
      align-items: center;
      white-space: nowrap;
    }
    .btn-nav:hover { background: var(--bg); }

    /* ── Recherche + filtres ──────────────────────────── */
    .search-bar {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 10px 14px;
      border-bottom: 1.5px solid var(--border);
      background: var(--surface);
      flex-shrink: 0;
    }

    #search-input {
      flex: 1;
      padding: 8px 12px;
      border: 1.5px solid var(--border);
      border-radius: 10px;
      font-size: 14px;
      font-family: inherit;
      color: var(--text-primary);
      background: var(--bg);
      outline: none;
    }
    #search-input:focus { border-color: var(--green); }

    .filter-tabs {
      display: flex;
      gap: 4px;
      flex-shrink: 0;
    }

    .filter-tab {
      padding: 7px 12px;
      border-radius: 8px;
      border: 1.5px solid var(--border);
      background: var(--surface);
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      color: var(--text-secondary);
      transition: all 0.12s;
    }
    .filter-tab:hover { background: var(--bg); }
    .filter-tab.active {
      background: var(--text-primary);
      color: #fff;
      border-color: var(--text-primary);
    }
    .filter-tab.active-paid {
      background: var(--green);
      color: #fff;
      border-color: var(--green);
    }
    .filter-tab.active-unpaid {
      background: var(--orange);
      color: #fff;
      border-color: var(--orange);
    }

    /* ── Liste réservations ───────────────────────────── */
    #res-list {
      flex: 1;
      overflow-y: auto;
      padding: 10px 12px;
    }

    .list-empty {
      text-align: center;
      color: var(--text-muted);
      padding: 32px 0;
      font-style: italic;
    }

    .res-item {
      padding: 11px 13px;
      border: 1.5px solid var(--border);
      border-radius: 12px;
      margin-bottom: 7px;
      background: var(--surface);
      cursor: pointer;
      transition: all 0.12s;
    }
    .res-item:hover { border-color: #b8b4ac; }
    .res-item.is-paid {
      background: #f0faf6;
      border-color: #a3d9c4;
    }
    .res-item.is-selected {
      border-color: var(--green);
      border-width: 2px;
      box-shadow: 0 0 0 3px rgba(29,158,117,0.10);
    }

    .res-row-main {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
    }

    .res-info {
      display: flex;
      flex-direction: column;
      gap: 2px;
      min-width: 0;
    }

    .res-name {
      font-size: 15px;
      font-weight: 700;
      color: var(--text-primary);
    }

    .res-guests {
      font-size: 12px;
      color: var(--text-secondary);
    }

    .res-right {
      display: flex;
      flex-direction: column;
      align-items: flex-end;
      gap: 4px;
      flex-shrink: 0;
    }

    .res-price {
      font-size: 15px;
      font-weight: 700;
      color: var(--text-primary);
    }

    .res-badge {
      font-size: 11px;
      font-weight: 700;
      padding: 2px 8px;
      border-radius: 20px;
    }
    .badge-paid   { background: #d1fae5; color: #065f46; }
    .badge-unpaid { background: #fff7ed; color: #92400e; }

    .res-cartes-hint {
      margin-top: 5px;
      font-size: 11px;
      font-weight: 600;
      color: var(--orange);
    }

    /* ── Panneau de détail ────────────────────────────── */
    .col-right {
      width: 340px;
      flex-shrink: 0;
      display: flex;
      flex-direction: column;
      background: var(--surface);
      border-left: 1.5px solid var(--border);
    }

    #detail-panel {
      flex: 1;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
    }

    .panel-header {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      padding: 18px 18px 14px;
      border-bottom: 1.5px solid var(--border);
      flex-shrink: 0;
    }

    .panel-title {
      font-size: 17px;
      font-weight: 800;
      color: var(--text-primary);
    }

    .panel-subtitle {
      font-size: 12px;
      color: var(--text-muted);
      margin-top: 2px;
    }

    .panel-phone {
      font-size: 13px;
      color: var(--text-secondary);
      margin-top: 3px;
    }

    .btn-close {
      width: 28px;
      height: 28px;
      border-radius: 8px;
      border: 1.5px solid var(--border);
      background: var(--bg);
      font-size: 16px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--text-secondary);
      flex-shrink: 0;
    }
    .btn-close:hover { background: var(--border); }

    .panel-section {
      padding: 14px 18px;
      border-bottom: 1px solid var(--border);
    }

    .panel-empty {
      padding: 28px 18px;
      text-align: center;
      color: var(--text-muted);
      font-style: italic;
      font-size: 14px;
    }

    .section-label {
      font-size: 11px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.07em;
      color: var(--text-muted);
      margin-bottom: 10px;
    }

    /* Grille convives */
    .guests-grid {
      display: flex;
      flex-direction: column;
      gap: 6px;
      margin-bottom: 12px;
    }

    .guest-row {
      display: flex;
      justify-content: space-between;
      font-size: 14px;
    }
    .guest-row span:first-child { color: var(--text-secondary); }
    .guest-row span:last-child  { font-weight: 700; }

    .prix-row {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      padding-top: 10px;
      border-top: 1px solid var(--border);
    }
    .prix-row span:first-child { font-size: 14px; color: var(--text-secondary); }
    .prix-val { font-size: 20px; font-weight: 800; }

    /* Dessert */
    .panel-dessert { background: #fffbeb; }
    .dessert-cp   { font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.06em; color: #92400e; margin-bottom: 3px; }
    .dessert-nom  { font-size: 14px; font-weight: 600; color: #78350f; }

    /* Bouton payé */
    .btn-toggle-paid {
      width: 100%;
      padding: 13px;
      border-radius: 12px;
      border: none;
      font-size: 15px;
      font-weight: 700;
      cursor: pointer;
      transition: background 0.12s;
    }
    .btn-payer {
      background: var(--green);
      color: #fff;
    }
    .btn-payer:hover { background: var(--green-dark); }
    .btn-annuler-paiement {
      background: var(--bg);
      color: var(--text-secondary);
      border: 1.5px solid var(--border) !important;
    }
    .btn-annuler-paiement:hover { background: var(--border); }

    /* Boutons cartes */
    .carte-btns {
      display: flex;
      gap: 8px;
    }

    .btn-carte {
      flex: 1;
      padding: 11px 6px;
      border-radius: 12px;
      border: 1.5px solid var(--border);
      background: var(--bg);
      font-size: 15px;
      font-weight: 700;
      color: var(--orange);
      cursor: pointer;
      transition: all 0.12s;
    }
    .btn-carte:hover { background: #fff7f4; border-color: var(--orange); }
    .btn-carte:disabled { opacity: 0.5; cursor: not-allowed; }

    /* Liste des cartes */
    .cartes-list {
      display: flex;
      flex-direction: column;
      gap: 5px;
      margin-bottom: 8px;
    }

    .carte-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 7px 10px;
      background: var(--bg);
      border-radius: 8px;
    }

    .carte-amount { font-size: 14px; font-weight: 700; color: var(--orange); }

    .btn-del-carte {
      width: 22px;
      height: 22px;
      border-radius: 6px;
      border: 1px solid var(--border);
      background: transparent;
      cursor: pointer;
      font-size: 14px;
      color: var(--text-muted);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 0;
    }
    .btn-del-carte:hover { background: #fee2e2; color: #dc2626; border-color: #fca5a5; }

    .cartes-subtotal {
      font-size: 12px;
      font-weight: 700;
      color: var(--text-secondary);
      text-align: right;
    }

    /* Footer total */
    .panel-footer {
      margin-top: auto;
      padding: 16px 18px;
      border-top: 1.5px solid var(--border);
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      background: var(--surface);
      flex-shrink: 0;
    }
    .total-label { font-size: 14px; font-weight: 600; color: var(--text-secondary); }
    .total-val   { font-size: 28px; font-weight: 800; color: var(--text-primary); }
  </style>
</head>
<body>

<div id="app-souper">

  <!-- ── Colonne gauche ─────────────────────────────────── -->
  <div class="col-left">

    <header class="stats-bar">
      <div class="stats-item">
        <span class="stats-label">CA Souper</span>
        <span class="stats-value" id="ca-total">…</span>
      </div>
      <div class="sep"></div>
      <div class="stats-item">
        <span class="stats-label">Payées</span>
        <span class="stats-value" style="color:var(--green)" id="nb-paid">…</span>
      </div>
      <div class="stats-item">
        <span class="stats-label">Impayées</span>
        <span class="stats-value" style="color:var(--orange)" id="nb-unpaid">…</span>
      </div>
      <div class="sep"></div>
      <div class="stats-item">
        <span class="stats-label">Cartes</span>
        <span class="stats-value" id="cartes-total">…</span>
      </div>
      <button class="btn-standalone" id="btn-standalone">+ Carte indép.</button>
      <a href="../index.html" class="btn-nav">Bar</a>
    </header>

    <div class="search-bar">
      <input type="search" id="search-input" placeholder="Rechercher un nom…">
      <div class="filter-tabs">
        <button class="filter-tab active" data-filter="all">Tous</button>
        <button class="filter-tab" data-filter="paid">Payés</button>
        <button class="filter-tab" data-filter="unpaid">Impayés</button>
      </div>
    </div>

    <div id="res-list">
      <p class="list-empty">Chargement…</p>
    </div>

  </div>

  <!-- ── Colonne droite ─────────────────────────────────── -->
  <div class="col-right">
    <div id="detail-panel">
      <p class="panel-empty" style="margin-top:60px">
        Sélectionne une réservation<br>ou ajoute une carte indépendante.
      </p>
    </div>
  </div>

</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script src="../config.js"></script>
<script src="souper.js"></script>
</body>
</html>
